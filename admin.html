<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaivan Stone | Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-header">
        <a href="/">Kaivan Stone</a>
        <p>Internal Admin Dashboard</p>
    </header>

    <main class="admin-main">

        <button id="logout-button" type="button">Logout</button>

        <!-- =========================
             STONE MANAGEMENT
        ========================== -->

        <section class="stone-management" aria-labelledby="stone-management-heading">

            <div class="section-heading">
                <p>Stone Management</p>
                <h1 id="stone-management-heading">Manage Stones</h1>
            </div>

            <div
                id="stone-message"
                class="admin-message"
                role="status"
                aria-live="polite">
            </div>

            <form id="stone-form">

                <input type="hidden" id="stone-edit-id">

                <div class="form-grid">

                    <div>
                        <label for="stone-id">Stone ID</label>
                        <input
                            type="text"
                            id="stone-id"
                            required>
                    </div>

                    <div>
                        <label for="stone-name">Name</label>
                        <input
                            type="text"
                            id="stone-name"
                            required>
                    </div>

                    <div>
                        <label for="stone-origin">Origin</label>
                        <input
                            type="text"
                            id="stone-origin"
                            required>
                    </div>

                    <div>
                        <label for="stone-price">Price</label>
                        <input
                            type="text"
                            id="stone-price"
                            required>
                    </div>

                    <div>
                        <label for="stone-dimensions">Dimensions</label>
                        <input
                            type="text"
                            id="stone-dimensions"
                            required>
                    </div>

                    <div>
                        <label for="stone-rating">Rating</label>
                        <input
                            type="number"
                            id="stone-rating"
                            min="0"
                            max="5"
                            step="0.1">
                    </div>

                    <div>
                        <label for="stone-image">Image</label>
                        <input
                            type="text"
                            id="stone-image">
                    </div>

                    <div class="checkbox-field">
                        <label for="stone-in-stock">
                            <input
                                type="checkbox"
                                id="stone-in-stock"
                                checked>
                            In Stock
                        </label>
                    </div>

                </div>

                <div>
                    <label for="stone-description">Description</label>
                    <textarea
                        id="stone-description"
                        rows="5"
                        required></textarea>
                </div>

                <div>
                    <label for="stone-certifications">
                        Certifications
                    </label>

                    <input
                        type="text"
                        id="stone-certifications"
                        placeholder="Example: ISO, CE, ASTM">
                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        id="stone-submit">
                        Add Stone
                    </button>

                    <button
                        type="button"
                        id="stone-cancel"
                        hidden>
                        Cancel Edit
                    </button>

                </div>

            </form>

            <div
                id="stone-list"
                class="stone-list"
                aria-live="polite">
            </div>

        </section>


        <!-- =========================
             QUOTE MANAGEMENT
        ========================== -->

        <section
            class="quote-requests"
            aria-labelledby="quote-requests-heading">

            <div class="section-heading">
                <p>Quote Management</p>
                <h1 id="quote-requests-heading">
                    Quote Requests
                </h1>
            </div>

            <div
                id="quote-list"
                aria-live="polite">
            </div>

            <div
                id="quote-detail"
                aria-live="polite">

                <h2>Select a quote request</h2>

                <p>
                    Choose a quote request above to view its details.
                </p>

            </div>

        </section>

    </main>

    <script src="admin.js"></script>

</body>

</html>
