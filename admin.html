<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaivan Stone | Quote Management</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-header">
        <a href="/">Kaivan Stone</a>
        <p>Internal Quote Management</p>
    </header>

    <main class="admin-main">
        <section class="quote-requests" aria-labelledby="quote-requests-heading">
            <div class="section-heading">
                <p>Quote Management</p>
                <h1 id="quote-requests-heading">Quote Requests</h1>
            </div>
            <div id="quote-list" aria-live="polite"></div>
            <div id="quote-detail" aria-live="polite">
                <h2>Select a quote request</h2>
                <p>Choose a quote request above to view its details.</p>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>

</body>

</html>
